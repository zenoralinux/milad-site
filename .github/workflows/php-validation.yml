name: Application validation

on:
  push:
    branches:
      - feature/admin-cms-blueprint-20261114
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js
      - name: Check public JavaScript syntax
        run: node --check assets/js/site.js
      - name: Validate patch whitespace
        run: git diff --check

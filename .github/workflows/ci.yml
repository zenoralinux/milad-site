name: Site integrity
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Test self-contained internal preview
        run: php tests/internal-preview.php
      - name: Test root and subdirectory URL routing
        run: |
          php tests/path-routing.php /index.php ''
          php tests/path-routing.php /portfolio/admin/index.php /portfolio
          php tests/path-routing.php /portfolio/admin/studio.php /portfolio
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: for file in $(find assets/js -type f -name '*.js'); do node --check "$file"; done
      - name: Check builder interaction invariants
        run: node tests/builder-static.test.js
